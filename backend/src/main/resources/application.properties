spring.application.name=documentqa

# --- PostgreSQL ---
# Your native Postgres install on 5432, database "documentqa", pgvector
# extension already enabled. Values come from env vars so no credentials are
# committed; the fallback after the colon is used if the env var isn't set.
spring.datasource.url=jdbc:postgresql://localhost:5432/documentqa
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# update = Hibernate creates/adjusts tables for our @Entity classes automatically.
# Fine while iterating solo on a student project; swap for a migration tool
# (e.g. Flyway) if this ever needed to run against a shared/prod database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- File uploads ---
# Default multipart limit (1MB) is too small for real documents.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Spring AI: chat model ---
# Explicit even though Anthropic is the only chat-capable starter on the
# classpath now - keeps intent clear if another chat provider gets added later.
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-5

# --- Spring AI: embedding model ---
# Anthropic has no embeddings API, so this uses the Transformers starter's
# built-in model (all-MiniLM-L6-v2) running in-process via ONNX - no API key,
# no external service. Lower quality than a hosted embedding model, but free
# and needs nothing beyond ANTHROPIC_API_KEY to run the whole app.
#
# By default Spring AI caches the downloaded model/tokenizer files in a fresh
# random temp folder every single JVM run (Files.createTempDirectory), so the
# ~90MB model.onnx gets re-downloaded from GitHub on every restart. Pinning
# the cache to a fixed, persistent directory means it's only ever downloaded
# once per machine.
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/spring-ai-onnx-model

# --- PGVector store ---
# PGVector = a Postgres extension that adds a `vector` column type plus
# similarity search operators/indexes. Spring AI's VectorStore abstraction
# uses it to store each document chunk's embedding (a list of floats
# capturing its meaning) and, at query time, find the chunks whose vectors
# are closest to the question's vector ("nearest neighbor search") - that's
# the "Retrieval" half of Retrieval-Augmented Generation.
#
# dimensions must match the embedding model's output size - all-MiniLM-L6-v2
# (the Transformers starter's default model) produces 384-dimensional vectors.
# initialize-schema=true makes Spring AI create the `vector_store` table
# itself on startup (the pgvector extension itself you've already enabled).
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.initialize-schema=true
